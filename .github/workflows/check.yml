name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOONWEAVE_EGGLOG_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/egglog/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/egglog/requirements.txt
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:types
      - run: python tools/egglog/test_run.py
      - run: node tools/check-optimizer.mjs validation/optimizer-check.json
      - run: python tools/test_package.py
      - run: npm run build
      - run: npm run check:package
      - run: python tools/check-source.py validation/source-package.json
